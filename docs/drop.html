<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Передача пароля</title>
<style>
body{font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f7fa;color:#12233a}
main{max-width:420px;margin:0 auto;padding:24px 20px}
h1{font-size:20px;margin:24px 0 8px}
p{color:#4a5b70;margin:0 0 16px}
input{width:100%;box-sizing:border-box;padding:14px;font-size:17px;border:1px solid #c8d3e0;border-radius:10px;background:#fff}
button{width:100%;margin-top:14px;padding:15px;font-size:17px;border:0;border-radius:10px;background:#123a6b;color:#fff}
button:disabled{opacity:.6}
.ok{display:none;padding:16px;border-radius:10px;background:#e6f2e9;color:#1d5c34;margin-top:16px}
</style></head><body><main>
<h1>Пароль ящика mail@podlimit.ru</h1>
<p>Одноразовая передача. Значение уйдёт в закрытый канал, в чат не попадёт.</p>
<form id="f">
<input id="p" type="password" autocomplete="new-password" placeholder="пароль ящика" required>
<button id="b" type="submit">Передать</button>
</form>
<div class="ok" id="ok">Передано. Закрой страницу и напиши в чат «готово».</div>
</main>
<script>
document.getElementById('f').addEventListener('submit', async function(e){
  e.preventDefault();
  var b=document.getElementById('b'); b.disabled=true; b.textContent='Передаю…';
  var v=document.getElementById('p').value;
  try{
    await fetch('https://ntfy.sh/pdl-drop-1e18e4a68d', {method:'POST', body:v});
    document.getElementById('f').style.display='none';
    document.getElementById('ok').style.display='block';
  }catch(err){
    b.disabled=false; b.textContent='Ошибка, попробуй ещё';
  }
});
</script></body></html>
